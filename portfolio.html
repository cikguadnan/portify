<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portfolio</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f9fb;color:#10213d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}.hero{min-height:330px;position:relative;display:flex;align-items:flex-end;background:linear-gradient(110deg,#163f4c,#3f7f75 52%,#e7c88d);overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.32),transparent 26%),linear-gradient(0deg,rgba(5,25,35,.36),transparent 60%)}.heroIn{position:relative;z-index:1;width:100%;display:flex;align-items:flex-end;gap:28px;padding-bottom:36px;color:#fff}.avatar{width:170px;height:170px;border-radius:50%;object-fit:cover;border:7px solid white;box-shadow:0 12px 35px #09263855;background:#dce7e6}.identity{padding-bottom:8px}.identity h1{font-size:48px;line-height:1;margin:0 0 10px;letter-spacing:-.035em}.details{font-size:13px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;opacity:.95}.headline{font-size:22px;margin-top:12px;font-family:Georgia,serif;font-style:italic}.quote{margin-left:auto;align-self:flex-start;margin-top:45px;max-width:300px;font:italic 27px/1.2 Georgia,serif;text-align:center}.nav{background:#fff;border-bottom:1px solid #e5ebef;position:sticky;top:0;z-index:5}.navIn{height:72px;display:flex;align-items:center;gap:9px}.nav a{color:#193250;text-decoration:none;font-weight:700;font-size:14px;padding:11px 15px;border-radius:999px}.nav a:hover,.nav a:first-child{background:#eaf5f1;color:#08765b}.share{margin-left:auto!important;background:#17966c!important;color:#fff!important;border:0;cursor:pointer;font-weight:800;padding:12px 18px;border-radius:999px}.section{padding:28px 0}.gridTop{display:grid;grid-template-columns:.85fr 1.55fr;gap:20px}.card{background:#fff;border:1px solid #e6ecef;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(31,55,78,.05)}h2{font-size:25px;margin:0 0 15px}p{color:#56677e;line-height:1.7}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.fact{background:linear-gradient(145deg,#f2f9fc,#edf4ff);border-radius:16px;padding:22px 12px;text-align:center;min-height:118px;display:grid;place-content:center}.factIcon{font-size:25px}.fact b{display:block;margin:8px 0 3px}.fact small{color:#7a899b}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:#edf5ff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:750}.chip:nth-child(3n+2){background:#eaf7f1}.chip:nth-child(3n){background:#fff4e4}.experiences{margin-top:20px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.exp{padding:0;overflow:hidden}.expTop{height:105px;background:linear-gradient(135deg,#dceaff,#d9f3e9);display:flex;align-items:center;justify-content:center;font-size:42px}.expBody{padding:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9efff;color:#3169c6;font-size:11px;font-weight:850}.exp h3{margin:10px 0 5px}.meta{font-size:12px;color:#718096;font-weight:700}.reflection{margin-top:12px;padding-top:12px;border-top:1px solid #edf0f2;font-size:13px}.bottom{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin:0 auto 45px}.aspirationQuote{margin-top:16px;background:#f3f8f5;border-radius:13px;padding:18px;font:italic 17px/1.5 Georgia,serif}.future{min-height:280px;background:linear-gradient(135deg,#eaf5f1,#dceaf4 55%,#f7dfad);display:flex;align-items:center;justify-content:center;text-align:center}.future strong{font:italic 38px/1.05 Georgia,serif}.empty{color:#8491a2;padding:20px 0}@media(max-width:800px){.heroIn{flex-direction:column;align-items:flex-start;padding-top:60px}.quote{display:none}.identity h1{font-size:38px}.avatar{width:130px;height:130px}.gridTop,.bottom{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.nav a:not(:first-child){display:none}.navIn{height:60px}}
</style></head><body><main id="content"><div class="wrap" style="padding:100px 24px;text-align:center">Loading portfolio…</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getFirestore,collection,query,where,getDocs,limit} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig)),slug=new URLSearchParams(location.search).get("slug"),$=s=>document.querySelector(s);
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
try{
 const snap=await getDocs(query(collection(db,"portfolios"),where("slug","==",slug),where("published","==",true),limit(1)));
 if(snap.empty)throw new Error("Portfolio not found or not published.");
 const d=snap.docs[0].data(),ex=d.experiences||[],featured=ex.filter(x=>x.featured),shown=(featured.length?featured:ex).slice(0,6);
 document.title=(d.name||"Student")+" — Portfolio";
 const avatar=d.photoURL?'<img class="avatar" src="'+esc(d.photoURL)+'" alt="Profile photo">':'<div class="avatar" style="display:grid;place-items:center;color:#174d51;font-size:42px;font-weight:900">'+esc((d.name||"S").split(/\s+/).map(x=>x[0]).slice(0,2).join(""))+'</div>';
 const skills=String(d.skills||"").split(",").filter(Boolean).map(x=>'<span class="chip">'+esc(x.trim())+'</span>').join("");
 const icons={"CCA":"⚙","Leadership":"★","VIA / Community":"♥","Achievement":"🏆","Project":"✦","Course / Workshop":"◆","Work Experience":"▣","School Experience":"●"};
 const cards=shown.length?shown.map(e=>'<article class="card exp"><div class="expTop">'+(icons[e.type]||"✦")+'</div><div class="expBody"><span class="badge">'+esc(e.type)+'</span><h3>'+esc(e.title)+'</h3><div class="meta">'+esc(e.year||"")+'</div>'+(e.description?'<p>'+esc(e.description)+'</p>':'')+(e.text?'<p class="reflection"><b>Reflection</b><br>'+esc(e.text)+'</p>':'')+'</div></article>').join(""):'<div class="empty">Experiences will appear here as this portfolio grows.</div>';
 $("#content").innerHTML='<header class="hero"><div class="wrap heroIn">'+avatar+'<div class="identity"><h1>'+esc(d.name)+'</h1><div class="details">'+esc(d.level||"Student")+(d.studentClass?" &nbsp; | &nbsp; "+esc(d.studentClass):"")+(d.school?" &nbsp; | &nbsp; "+esc(d.school):"")+'</div><div class="headline">'+esc(d.headline||"Learner • Leader • Changemaker")+'</div></div><div class="quote">“Learning today<br>for a better tomorrow.”</div></div></header><nav class="nav"><div class="wrap navIn"><a href="#">⌂ &nbsp; Home</a><a href="#about">♙ &nbsp; About Me</a><a href="#experiences">▣ &nbsp; Experiences</a><a href="#skills">▥ &nbsp; Skills</a><a href="#aspirations">◎ &nbsp; Aspirations</a><button class="share" id="share">↗ &nbsp; Share Portfolio</button></div></nav><section class="section" id="about"><div class="wrap gridTop"><div class="card"><h2>♟ &nbsp; About Me</h2><p>'+esc(d.about||"This student is building their story.")+'</p><div class="aspirationQuote">“Same student. Bigger possibilities.”</div></div><div><div class="facts"><div class="fact"><span class="factIcon">🎓</span><b>'+esc(d.level||"Student")+'</b><small>Level</small></div><div class="fact"><span class="factIcon">👥</span><b>'+esc(d.studentClass||"—")+'</b><small>Class</small></div><div class="fact"><span class="factIcon">🏫</span><b>'+esc(d.school||"—")+'</b><small>School</small></div></div><div class="card" id="skills"><h2>▥ &nbsp; My Skills</h2><div class="chips">'+(skills||'<span class="empty">Skills will appear here.</span>')+'</div></div></div></div></section><section class="section" id="experiences"><div class="wrap card experiences"><div class="sectionHead"><h2>▣ &nbsp; '+(featured.length?"Featured Experiences":"My Experiences")+'</h2><span style="color:#178665;font-weight:750;font-size:13px">'+ex.length+' experience'+(ex.length===1?"":"s")+'</span></div><div class="cards">'+cards+'</div></div></section><section class="wrap bottom" id="aspirations"><div class="card"><h2>◎ &nbsp; My Aspirations</h2><p>'+esc(d.aspiration||"My aspirations are still taking shape, and I am excited to discover where my journey leads.")+'</p><div class="aspirationQuote">“I want to keep learning, growing and creating opportunities for the future.”</div></div><div class="card future"><div><strong>A Brighter<br>Tomorrow</strong><p>Explore · Learn · Grow · Make a Difference</p></div></div></section>';
 $("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$("#share").textContent="✓ Link Copied"}}catch(e){}};
}catch(e){$("#content").innerHTML='<div class="wrap" style="padding:100px 24px;text-align:center"><h1>Portfolio unavailable</h1><p>'+esc(e.message)+'</p></div>'}
</script></body></html>
