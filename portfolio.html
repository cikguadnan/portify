<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portify Portfolio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17213a}nav{height:72px;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:auto;padding:0 28px}.brand{font-weight:900;font-size:21px}.hero{background:linear-gradient(135deg,#eef5ff,#f6edff);padding:85px 28px}.inner{max-width:1050px;margin:auto}.hero .inner{display:grid;grid-template-columns:1.35fr .65fr;align-items:center;gap:45px}.tag{font-size:12px;font-weight:850;color:#6257e8;letter-spacing:.08em}.hero h1{font-size:58px;letter-spacing:-.04em;line-height:1;margin:12px 0}.lead,.muted{color:#66738c;line-height:1.75}.avatar{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#756ce7,#b58cff);border:12px solid #ffffffbd;color:white;font-size:68px;font-weight:900}.section{padding:70px 28px}.section h2{font-size:34px;margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.chip{padding:9px 13px;border-radius:999px;background:#f0efff;color:#5045bf;font-size:13px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:28px}.card{border:1px solid #e6e9f2;border-radius:18px;padding:22px}.meta{font-size:12px;color:#6257e8;font-weight:800}.card p{color:#66738c;line-height:1.6;font-size:14px}.error{max-width:650px;margin:100px auto;padding:30px;text-align:center}@media(max-width:760px){.hero .inner{grid-template-columns:1fr;text-align:center}.avatar{grid-row:1;width:170px;height:170px}.hero h1{font-size:42px}.cards{grid-template-columns:1fr}}</style></head><body><nav><div class="brand">◈ Portify</div><span id="school"></span></nav><main id="content"><div class="error">Loading portfolio…</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig)), slug=new URLSearchParams(location.search).get("slug");
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
try{const snap=await getDocs(query(collection(db,"portfolios"),where("slug","==",slug),where("published","==",true),limit(1)));if(snap.empty)throw new Error("Portfolio not found or not published.");const d=snap.docs[0].data(),ini=d.name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();document.title=d.name+" — Portfolio";document.querySelector("#school").textContent=d.school||"";document.querySelector("#content").innerHTML='<header class="hero"><div class="inner"><div><div class="tag">STUDENT PORTFOLIO</div><h1>Hi, I’m '+esc(d.name)+'.</h1><b>'+esc(d.headline)+'</b><p class="lead">'+esc(d.about)+'</p></div><div class="avatar">'+esc(ini)+'</div></div></header><section class="section"><div class="inner"><div class="tag">MY DIRECTION</div><h2>'+esc(d.aspiration)+'</h2><div class="chips">'+String(d.skills||"").split(",").filter(Boolean).map(x=>'<span class="chip">'+esc(x.trim())+'</span>').join("")+'</div></div></section><section class="section" style="background:#f8f9fc"><div class="inner"><div class="tag">MY JOURNEY</div><h2>Experiences that shaped me.</h2><div class="cards">'+(d.experiences||[]).map(e=>'<article class="card"><h3>'+esc(e.title)+'</h3><div class="meta">'+esc(e.type)+' • '+esc(e.year)+'</div><p>'+esc(e.text)+'</p></article>').join("")+'</div></div></section>'}catch(e){document.querySelector("#content").innerHTML='<div class="error"><h1>Portfolio unavailable</h1><p>'+esc(e.message)+'</p></div>'}
</script></body></html>
